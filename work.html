<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Work | getzeekey.com</title>
    <meta name="description" content="Selected artworks by getzeekey." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="work-page">
    <header class="work-header">
      <a href="index.html">getzeekey.com</a>
      <nav aria-label="Work navigation">
        <a href="#video">Video</a>
        <a href="#works">Works</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main>
      <section class="work-hero" id="video">
        <video autoplay muted loop playsinline controls>
          <source src="assets/home-water.mp4" type="video/mp4" />
        </video>
      </section>

      <section class="artwork-grid" id="works" aria-label="Selected works">
        <figure>
          <img src="assets/sensing-the-unseen.jpg" alt="Sensing the unseen" width="1600" height="1066" loading="lazy" decoding="async" />
          <figcaption>Sensing the unseen</figcaption>
        </figure>
        <figure>
          <img src="assets/the-infinity-of-tides.jpg" alt="The Infinity of Tides" width="1600" height="1192" loading="lazy" decoding="async" />
          <figcaption>The Infinity of Tides</figcaption>
        </figure>
        <figure>
          <img src="assets/man-machines-dialogue.jpg" alt="Man-Machine's Dialogue" width="1600" height="940" loading="lazy" decoding="async" />
          <figcaption>Man-Machine&rsquo;s Dialogue</figcaption>
        </figure>
        <figure>
          <img src="assets/the-butterfly-in-the-brain.jpg" alt="The Butterfly in the Brain" width="1600" height="1128" loading="lazy" decoding="async" />
          <figcaption>The Butterfly in the Brain</figcaption>
        </figure>
        <figure>
          <img src="assets/poetry-of-city.jpg" alt="Poetry of City" width="792" height="442" loading="lazy" decoding="async" />
          <figcaption>Poetry of City</figcaption>
        </figure>
        <figure>
          <img src="assets/caring-knot.jpg" alt="Caring Knot" width="1600" height="897" loading="lazy" decoding="async" />
          <figcaption>Caring Knot</figcaption>
        </figure>
      </section>

      <section class="contact-strip" id="contact">
        <a href="mailto:hello@getzeekey.com">hello@getzeekey.com</a>
      </section>
    </main>
  </body>
</html>
